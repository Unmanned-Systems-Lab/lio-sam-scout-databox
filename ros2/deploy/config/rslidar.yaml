common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSHELIOS
      msop_port: 3344
      difop_port: 5566
      imu_port: 0
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 200.0
      use_lidar_clock: false
      dense_points: false
      ts_first_point: true
      start_angle: 0.0
      end_angle: 360.0
      split_frame_mode: 1
      split_angle: 0.0
    ros:
      ros_frame_id: rslidar
      ros_recv_packet_topic: /rslidar_packets
      ros_send_packet_topic: /rslidar_packets
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_send_point_cloud_topic: /rslidar_points
      # Existing driver publishes native Autoware XYZIRCAEDT.
      # Adapter reads channel and time_stamp (relative nanoseconds).
      ros_queue_length: 5
